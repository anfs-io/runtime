# The users block of the server.conf core/nats renders (core's lib/anfs/bus.sh, anfs_bus_nats_conf,
# agents/05b) with ANFS_BUS_LAYERS=cnfs, the passwords replaced: what a layer's publisher user may
# do on the dev bus. Copied by hand; update it when core's rendering changes.
authorization {
  users: [
    {user: "anfsd", password: "anfsdpw"}
    {user: "admin", password: "adminpw"}
    {
      user: "reader", password: "readerpw"
      permissions: {
        subscribe: {allow: ["anfs.>", "_INBOX.>"]}
        publish: {allow: [
          "$JS.API.INFO", "$JS.API.STREAM.INFO.ANFS",
          "$JS.API.CONSUMER.*.ANFS.>", "$JS.API.CONSUMER.DURABLE.CREATE.ANFS.>",
          "$JS.API.CONSUMER.MSG.NEXT.ANFS.>", "$JS.ACK.ANFS.>"
        ]}
      }
    }
    {
      user: "cnfs", password: "cnfspw"
      permissions: {
        subscribe: {allow: ["anfs.>", "_INBOX.>"]}
        publish: {allow: [
          "anfs.*.cnfs.>",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.ANFS",
          "$JS.API.CONSUMER.*.ANFS.>", "$JS.API.CONSUMER.DURABLE.CREATE.ANFS.>",
          "$JS.API.CONSUMER.MSG.NEXT.ANFS.>", "$JS.ACK.ANFS.>"
        ]}
      }
    }
  ]
}
